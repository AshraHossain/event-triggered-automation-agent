name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (dev extras)
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy)
        run: uv run mypy etaa

      - name: Security scan (bandit)
        run: uv run bandit -q -r etaa

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --skip-editable

      - name: Test with coverage gate (>=90%)
        run: uv run pytest -q --cov=etaa --cov-report=term-missing --cov-fail-under=90

      - name: Validate example workflows
        run: uv run etaa validate examples/

      - name: Classifier evaluation (offline baseline)
        run: uv run python -m evals.run_eval

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t etaa:ci .
