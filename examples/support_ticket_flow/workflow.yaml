# Support Ticket Automation Workflow
# Triggered when a new support ticket is created.
# Actions: classify ticket (AI stub) → assign owner (function) → send ack email (HTTP).
# Retry: workflow-level default retry policy.
# DLQ: SQLite table for tickets that cannot be processed.
# The classification is passed forward with {{steps.classify_ticket.classification}}.

id: support-ticket-flow
name: Support Ticket Automation
description: >
  When a new support ticket arrives, automatically classify its topic using AI,
  assign it to the right owner, and send an acknowledgment email to the requester.

triggers:
  - source: support_system
    type: ticket_created

actions:
  - id: classify_ticket
    type: ai
    config:
      # stub = offline keyword rules. Switch to `anthropic` or `openai` (with the
      # matching API key) for a real model; the output is still forced into `labels`.
      provider: stub
      prompt: "Classify this support ticket.\nTicket: {{payload.description}}"
      labels: [billing, technical, account, general]
      default_label: general
      stub_rules:
        billing: [charged, invoice, refund, payment]
        account: [password, login, sign in]
        technical: [error, crash, bug, slow]
      max_tokens: 20
    depends_on: []

  - id: assign_owner
    type: function
    config:
      module_path: examples.support_ticket_flow.handlers.assign_owner
    depends_on:
      - classify_ticket

  - id: send_ack_email
    type: http
    config:
      method: POST
      url: "https://api.example.com/emails/send"
      headers:
        Authorization: "Bearer {{env.ETAA_SECRET_EMAIL_TOKEN}}"
        Content-Type: "application/json"
      body:
        to: "{{payload.requester_email}}"
        subject: "We received your support ticket"
        body: "Thank you for contacting us. Your ticket was categorised as {{steps.classify_ticket.classification}} and assigned to {{steps.assign_owner.result.assigned_to}}."
      timeout: 10
      expected_status_codes: [200, 201]
    depends_on:
      - assign_owner
    retry_policy:
      max_attempts: 2
      backoff_strategy: fixed
      backoff_seconds: 1.0
      retryable_error_codes: [429, 500, "timeout"]

retry_policy:
  max_attempts: 3
  backoff_strategy: exponential
  backoff_seconds: 0.5

dlq:
  target_type: db
  target_config:
    table_name: dlq_support_tickets
    db_path: ./data/dlq/support.db
  include_payload: true
  include_error: true
