# GitOps Automation Workflow
# Triggered by GitHub push events.
# Actions: start CI job (function) → notify Slack (HTTP).
# Retry: fixed backoff for Slack notifications.
# DLQ: JSONL file (./data/dlq/gitops.jsonl).

id: gitops-automation
name: GitOps Automation
description: >
  Reacts to GitHub push events by kicking off a CI pipeline and notifying
  the team on Slack.  Slack notifications are retried with fixed backoff;
  exhausted retries land in the dead-letter file.

triggers:
  - source: github
    type: push
    filters:
      ref: "refs/heads/main"

actions:
  - id: start_ci
    type: function
    config:
      module_path: examples.gitops_automation.handlers.start_ci
    depends_on: []

  - id: notify_slack
    type: http
    config:
      method: POST
      url: "https://hooks.slack.com/services/EXAMPLE/WEBHOOK/URL"
      headers:
        Content-Type: "application/json"
      body:
        text: |
          New push on **{{source}}** repo.
          Branch: {{payload.ref}}
          Commit: {{payload.head_commit.id}}
          Author: {{payload.head_commit.author.name}}
      timeout: 10
      expected_status_codes: [200]
    retry_policy:
      max_attempts: 3
      backoff_strategy: fixed
      backoff_seconds: 2.0
      retryable_error_codes: [429, 500, "timeout"]

retry_policy:
  max_attempts: 3
  backoff_strategy: fixed
  backoff_seconds: 1.0

dlq:
  target_type: file
  target_config:
    path: ./data/dlq/gitops.jsonl
  include_payload: true
  include_error: true
